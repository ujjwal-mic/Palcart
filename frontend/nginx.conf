# nginx settings for the frontend container.

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Anything starting with /api/ goes to the backend container (named "backend"
    # in docker-compose.yml). The agent can take a while to answer, so wait up to 3 minutes.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Everything else is the React page.
    location / {
        try_files $uri /index.html;
    }
}
